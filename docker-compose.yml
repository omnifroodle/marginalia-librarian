# Local Couchbase Server for the training loop.
#
# Enterprise Edition is required: FTS vector search (Lesson 9) is EE-only.
# EE is free for development and testing.
#
# First run: `docker compose up -d`, then open http://localhost:8091 and
# initialize the cluster BY HAND (Lesson 0 — this is deliberate DCE practice):
#   - Setup New Cluster; name it whatever you like
#   - Services: Data, Query, Index, Search (Analytics/Eventing/Backup not needed)
#   - Set memory quotas (defaults are fine for a demo corpus)
#   - Admin credentials — these go in config.yaml (couchbase.username/password),
#     never in this file or in git
#   - Create bucket `librarian`
# Cluster state persists in the named volume; `docker compose down -v` wipes it.
services:
  couchbase:
    image: couchbase/server:enterprise-7.6.5
    container_name: marginalia-librarian-couchbase
    ports:
      - "8091-8096:8091-8096"    # web UI / REST (8091), views, query, FTS, ...
      - "18091-18096:18091-18096" # TLS variants
      - "11210:11210"            # KV (memcached protocol)
      - "11207:11207"            # KV over TLS
    volumes:
      - couchbase-data:/opt/couchbase/var

volumes:
  couchbase-data:

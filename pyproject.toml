[project]
name = "librarian"
version = "0.1.0"
description = "Headless retrieval service: PageIndex trees + OpenSearch + liner-note generation"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "opensearch-py>=2.4",
    "litellm>=1.0",
    # litellm's tool-calling path imports tenacity lazily; without it, agentic
    # tree reasoning silently degrades to one_shot
    "tenacity>=8.0",
    "pymupdf>=1.26",
    # PyPDF2 was renamed to pypdf; 3.0.1 was its final release and it has had no
    # maintenance since 2022. Same lineage, so the swap was mechanical — see the
    # local-changes list in librarian/pageindex/__init__.py.
    "pypdf>=5.0",
    "pycryptodome>=3.0",
    "ebooklib>=0.18",
    "markdownify>=0.12",
    # EPUB chapter extraction and serve-time rendering. beautifulsoup4 and lxml
    # arrived transitively (via markdownify and ebooklib); epub.py imports them
    # directly, so they are pinned here rather than by someone else's accident.
    "beautifulsoup4>=4.9",
    "lxml>=5.0",
    # HTML sanitizer (Rust/Ammonia). Chapter HTML is injected into the reader's
    # DOM — a hand-rolled allowlist is the wrong thing to own.
    "nh3>=0.2",
    "couchbase>=4.6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # httpx for test_llm_retry's response fixtures; httpx2 because starlette's
    # TestClient (fastapi.testclient) deprecated httpx and warns at import.
    "httpx>=0.27",
    "httpx2>=2.0",
    # pyflakes is used through its API by tests/test_hygiene.py, so it stays a
    # dependency in its own right even though ruff subsumes its checks.
    "pyflakes>=3.0",
    "ruff>=0.16",
]

[project.scripts]
librarian = "librarian.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
# The vendored PageIndex fork is upstream's code with a documented set of local
# changes (see librarian/pageindex/__init__.py). Restyling it would make those
# changes unreadable against upstream.
extend-exclude = ["src/librarian/pageindex"]

[tool.ruff.lint]
# Deliberately narrow. These four are the rules that tests/test_hygiene.py
# already enforces, or that came out of review often enough to be worth
# automating — the point is that the editor and the test suite agree, not that
# every stylistic opinion is turned on. Widen once this stays clean.
#   F     pyflakes (what test_hygiene.py runs through the API)
#   BLE   blind except — a handler wide enough to catch your own bugs will
#         report them as somebody else's
#   T20   print() outside the presentation layer
#   G     logging format: lazy %s args, not f-strings built before the level check
select = ["F", "BLE", "T20", "G"]

[tool.ruff.lint.per-file-ignores]
"src/librarian/cli.py" = ["T201", "BLE001"]  # presentation layer (uses click.echo)
"tests/**" = ["BLE001"]             # fixture teardown catches broadly on purpose

# BLE001 is scoped to cb/ exactly as tests/test_hygiene.py scopes it: the legacy
# tree predates the rule and churning it would collide with the migration that
# is deleting it. This list is therefore a shrinking one — opensearch/ goes in
# Lesson 11 — and an entry here is a statement that the module is on its way
# out, not that blind excepts are fine in it.
"src/librarian/api/*" = ["BLE001"]
"src/librarian/ingestion/*" = ["BLE001"]
"src/librarian/notes/*" = ["BLE001"]
"src/librarian/opensearch/*" = ["BLE001"]
"src/librarian/query/*" = ["BLE001"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a live Couchbase cluster (docker compose up); excluded by default",
]
# Unit tests only by default; run `pytest -m integration` for live-cluster tests.
addopts = "-m 'not integration'"

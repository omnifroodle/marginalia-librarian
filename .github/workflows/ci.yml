name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        # Pinned by the dev extra, but installed on its own so linting doesn't
        # wait on litellm and the Couchbase SDK.
        run: pip install "ruff>=0.16"
      - name: ruff
        # Config (rule selection, per-file scoping) lives in pyproject.toml, so
        # this is the same check the editor runs.
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the version this is developed on.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[api,dev]"
      - name: Unit tests
        # Integration tests are excluded by pyproject's addopts and need a live
        # Couchbase cluster; this job deliberately runs neither one.
        run: pytest tests/ -q
